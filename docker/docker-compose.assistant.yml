# ============================================================================
# Karakeep + Personal Knowledge Base Assistant — one-shot stack
# ----------------------------------------------------------------------------
# Brings up everything needed by the Assistant feature with a single command:
#
#   - web + workers  (built from local source via the AIO target,
#                     includes the Assistant feature on top of upstream)
#   - meilisearch    (vector store backing RAG retrieval)
#   - chrome         (headless browser used by the bookmark crawler)
#
# First run:
#
#   cp docker/.env.assistant.example .env
#   # edit .env and fill in secrets
#   docker compose -f docker/docker-compose.assistant.yml --env-file .env up -d --build
#
# Subsequent runs (no source changes):
#
#   docker compose -f docker/docker-compose.assistant.yml --env-file .env up -d
#
# Open http://localhost:3000 — the first account you register becomes admin.
# ============================================================================

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: aio
      # Use the host's native arch to avoid slow QEMU emulation when building
      # on Apple Silicon. Override KARAKEEP_PLATFORM=linux/amd64 if you really
      # need the Intel image (e.g. you'll deploy this image to an amd64 server).
      platforms:
        - ${KARAKEEP_PLATFORM:-linux/arm64}
    restart: unless-stopped
    depends_on:
      meilisearch:
        condition: service_healthy
      chrome:
        condition: service_started
    ports:
      - "${KARAKEEP_PORT:-3000}:3000"
    volumes:
      - data:/data
    env_file:
      - ../.env
    environment:
      # --- Wiring between containers (do not override in .env) ---
      DATA_DIR: /data
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222

      # --- Assistant defaults (override in .env if you want) ---
      # Auto-embed new/updated bookmarks so the vector store has data the
      # assistant can retrieve. Without this the chat falls back to general
      # knowledge instead of citing your bookmarks.
      EMBEDDING_ENABLE_AUTO_INDEXING: ${EMBEDDING_ENABLE_AUTO_INDEXING:-true}
      # Auto-tag + auto-summarize improve RAG snippet quality.
      INFERENCE_ENABLE_AUTO_TAGGING: ${INFERENCE_ENABLE_AUTO_TAGGING:-true}
      INFERENCE_ENABLE_AUTO_SUMMARIZATION: ${INFERENCE_ENABLE_AUTO_SUMMARIZATION:-true}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
    volumes:
      - meilisearch:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  chrome:
    image: gcr.io/zenika-hub/alpine-chrome:124
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars

volumes:
  data:
  meilisearch:
